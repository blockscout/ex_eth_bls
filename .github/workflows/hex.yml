name: Publish to Hex.pm

# This workflow is normally invoked by the "Build precompiled NIFs" workflow
# (release.yml) once all NIF archives are attached to the GitHub release.
# It can also be run manually for an existing release tag whose Hex publish
# failed or was skipped.
#
# It must only run after the release assets exist, because it downloads every
# precompiled archive to build `checksum-*.exs` and because the final
# `mix hex.publish` compiles the project in precompiled mode, which fetches the
# NIF for the runner from the release.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1)"
        required: true
        type: string
    secrets:
      HEX_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.1). The GitHub release with all NIF archives must already exist."
        required: true
        type: string

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"

      # Needed to build the NIF locally (EX_ETH_BLS_BUILD=true) for the test
      # run and for `mix rustler_precompiled.download`, which requires the
      # NIF module to be compiled before it can resolve the artifact list.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: mix deps.get

      # The steps below run in MIX_ENV=test with a locally built NIF, so that
      # the dev build used by `mix hex.publish` stays untouched and is compiled
      # in precompiled mode.
      - name: Compile with locally built NIF
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test
          EX_ETH_BLS_BUILD: "true"

      - name: Run tests
        run: mix test
        env:
          MIX_ENV: test
          EX_ETH_BLS_BUILD: "true"

      # Downloads all precompiled archives attached to the GitHub release and
      # writes checksum-Elixir.ExEthBls.Native.exs in the project root. That
      # file is gitignored and ships only inside the Hex tarball (see
      # `package.files` in mix.exs); without it consumers fail with
      # "the precompiled NIF file does not exist in the checksum file".
      - name: Generate NIF checksum file
        run: mix rustler_precompiled.download ExEthBls.Native --all --print
        env:
          MIX_ENV: test
          EX_ETH_BLS_BUILD: "true"

      - name: Verify checksum file covers every release archive
        run: |
          file=checksum-Elixir.ExEthBls.Native.exs
          test -s "$file" || { echo "::error::$file was not generated"; exit 1; }
          # Linux/macOS archives are named libex_eth_bls-*.so.tar.gz, Windows
          # ones ex_eth_bls-*.dll.tar.gz, so match on the suffix only.
          count=$(grep -c '\.tar\.gz" => "sha256:' "$file")
          echo "$file lists $count archives"
          # 2 NIF versions x 10 targets built by release.yml
          if [ "$count" -ne 20 ]; then
            echo "::error::expected 20 archives in $file, found $count"
            exit 1
          fi

      # Runs WITHOUT EX_ETH_BLS_BUILD and in the default (dev) env, so the
      # project is compiled exactly like consumers compile it: the NIF for this
      # runner is downloaded from the release and verified against the
      # checksum file. Docs are built with ex_doc (a dev-only dependency).
      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
